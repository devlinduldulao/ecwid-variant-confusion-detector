name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: |
          npm run lint
          npm test

      - name: Build app and publishing assets
        run: |
          npm run build
          npm run build:publishing-assets

      - name: Prepare release archives
        run: |
          mkdir -p release-artifacts
          VERSION=$(node -p "require('./package.json').version")
          zip -rq "release-artifacts/variant-confusion-detector-ecwid-${VERSION}.zip" dist
          zip -rq "release-artifacts/variant-confusion-detector-ecwid-publishing-assets-${VERSION}.zip" assets/marketplace

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/*

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.zip